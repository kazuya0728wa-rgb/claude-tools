<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日報提出</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
    background: #f5f5f5;
    padding: 16px;
    color: #333;
  }
  h1 {
    text-align: center;
    font-size: 20px;
    padding: 16px 0 20px;
    color: #ff6d01;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,.1);
  }
  .section-title {
    font-size: 13px;
    font-weight: bold;
    color: #ff6d01;
    border-left: 4px solid #ff6d01;
    padding-left: 8px;
    margin-bottom: 14px;
  }
  .contract-title {
    font-size: 13px;
    font-weight: bold;
    color: #ff6d01;
    border-left: 4px solid #ff6d01;
    padding-left: 8px;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .remove-btn {
    background: none;
    border: 1px solid #ccc;
    border-radius: 6px;
    color: #999;
    font-size: 12px;
    padding: 2px 8px;
    cursor: pointer;
  }
  .field { margin-bottom: 14px; }
  label {
    display: block;
    font-size: 13px;
    color: #666;
    margin-bottom: 4px;
  }
  label .req { color: #e53935; margin-left: 2px; }
  input[type=text], input[type=date], input[type=number], select, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    background: #fafafa;
    appearance: none;
    -webkit-appearance: none;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: #ff6d01;
    background: #fff;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .checkbox-field {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
  }
  .checkbox-field input[type=checkbox] {
    width: 22px;
    height: 22px;
    accent-color: #ff6d01;
  }
  .checkbox-field label { margin: 0; font-size: 15px; color: #333; }
  .pay-method-group {
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fafafa;
    padding: 4px 0;
  }
  .pay-method-group .checkbox-field {
    padding: 8px 12px;
    border-bottom: 1px solid #eee;
  }
  .pay-method-group .checkbox-field:last-child { border-bottom: none; }
  textarea { min-height: 80px; resize: vertical; }
  .contract-block {
    background: #fff;
    border: 1px solid #ffd0a0;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .add-btn {
    width: 100%;
    padding: 12px;
    background: #fff;
    color: #ff6d01;
    font-size: 15px;
    font-weight: bold;
    border: 2px dashed #ff6d01;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 4px;
  }
  button[type=submit] {
    width: 100%;
    padding: 15px;
    background: #ff6d01;
    color: #fff;
    font-size: 17px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 8px;
  }
  button[type=submit]:disabled { background: #ccc; }
  #msg {
    display: none;
    text-align: center;
    padding: 20px;
    border-radius: 10px;
    font-size: 16px;
    margin-bottom: 16px;
  }
  #msg.success { background: #e8f5e9; color: #2e7d32; }
  #msg.error   { background: #ffebee; color: #c62828; }
</style>
</head>
<body>

<h1>📋 日報提出</h1>

<div id="msg"></div>

<form id="form">

  <!-- 基本情報 -->
  <div class="card">
    <div class="section-title">基本情報</div>

    <div class="field">
      <label>日付<span class="req">*</span></label>
      <input type="date" id="date" required>
    </div>

    <div class="field">
      <label>氏名<span class="req">*</span></label>
      <select id="name" required>
        <option value="">読み込み中...</option>
      </select>
    </div>

    <div class="field">
      <label>案件名<span class="req">*</span></label>
      <div class="pay-method-group" id="caseCheckboxes">
        <div class="checkbox-field" style="color:#999;padding:10px 12px;">読み込み中...</div>
      </div>
    </div>
  </div>

  <!-- 商談結果 -->
  <div class="card">
    <div class="section-title">商談結果</div>

    <div class="row2">
      <div class="field">
        <label>商談数<span class="req">*</span></label>
        <input type="number" id="deals" value="0" min="0">
      </div>
      <div class="field">
        <label>成約数</label>
        <input type="number" id="wins" value="0" min="0">
      </div>
      <div class="field">
        <label>失注数</label>
        <input type="number" id="losses" value="0" min="0">
      </div>
      <div class="field">
        <label>損切数</label>
        <input type="number" id="cuts" value="0" min="0">
      </div>
      <div class="field">
        <label>キャンセル・不着席</label>
        <input type="number" id="cancel" value="0" min="0">
      </div>
      <div class="field">
        <label>継続・２回目</label>
        <input type="number" id="repeat" value="0" min="0">
      </div>
    </div>

    <div class="field">
      <label>失注理由 / 録画URL</label>
      <input type="text" id="lossReason" placeholder="失注の場合は理由または録画URLを入力">
    </div>
  </div>

  <!-- 成約情報（動的ブロック） -->
  <div class="card">
    <div class="section-title">成約情報（成約した件数分追加してください）</div>
    <div id="contractsContainer"></div>
    <button type="button" class="add-btn" id="addContractBtn">＋ 成約を追加</button>
  </div>

  <!-- メモ -->
  <div class="card">
    <div class="section-title">メモ</div>
    <div class="field">
      <textarea id="memo" placeholder="自由記述"></textarea>
    </div>
  </div>

  <button type="submit" id="submitBtn">送信する</button>

</form>

<script>
  // 今日の日付をデフォルト設定
  (function() {
    var today = new Date();
    var y = today.getFullYear();
    var m = String(today.getMonth() + 1).padStart(2, '0');
    var d = String(today.getDate()).padStart(2, '0');
    document.getElementById('date').value = y + '-' + m + '-' + d;
  })();

  // 案件名リスト（サーバーから取得後に格納）
  var caseOptions = [];

  // メンバー一覧・案件名一覧をサーバーから取得
  google.script.run
    .withSuccessHandler(function(data) {
      var selName = document.getElementById('name');
      selName.innerHTML = '<option value="">選択してください</option>';
      data.members.forEach(function(name) {
        var opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        selName.appendChild(opt);
      });
      caseOptions = data.cases || [];
      // 案件名チェックボックスを生成
      var container = document.getElementById('caseCheckboxes');
      container.innerHTML = '';
      caseOptions.forEach(function(c, i) {
        var div = document.createElement('div');
        div.className = 'checkbox-field';
        div.style.cssText = 'padding:8px 12px;border-bottom:1px solid #eee;';
        div.innerHTML =
          '<input type="checkbox" id="case_cb_' + i + '" name="case_cb" value="' + c + '" style="width:22px;height:22px;accent-color:#ff6d01;">' +
          '<label for="case_cb_' + i + '" style="margin:0;font-size:15px;color:#333;">' + c + '</label>';
        container.appendChild(div);
      });
      if (container.lastChild) container.lastChild.style.borderBottom = 'none';
    })
    .withFailureHandler(function() {
      document.getElementById('name').innerHTML = '<option value="">取得失敗</option>';
      document.getElementById('caseCheckboxes').innerHTML = '<div style="padding:10px 12px;color:#c62828;">取得失敗</div>';
    })
    .getFormData();

  // 成約ブロックのカウンター
  var contractCount = 0;

  // 成約ブロックを生成する関数
  function createContractBlock() {
    contractCount++;
    var idx = contractCount;
    var div = document.createElement('div');
    div.className = 'contract-block';
    div.id = 'contract-' + idx;

    // 案件名のオプション生成
    var caseOptsHtml = '<option value="">選択してください</option>';
    caseOptions.forEach(function(c) {
      caseOptsHtml += '<option value="' + c + '">' + c + '</option>';
    });

    div.innerHTML =
      '<div class="contract-title">' +
        '<span>成約 ' + idx + '件目</span>' +
        '<button type="button" class="remove-btn" onclick="removeContract(' + idx + ')">削除</button>' +
      '</div>' +
      '<div class="field">' +
        '<label>決済方法</label>' +
        '<select name="payMethod_' + idx + '">' +
          '<option value="">選択してください</option>' +
          '<option value="現金">現金</option>' +
          '<option value="クレジットカード">クレジットカード</option>' +
          '<option value="銀行振込">銀行振込</option>' +
        '</select>' +
      '</div>' +
      '<div class="row2">' +
        '<div class="field">' +
          '<label>今回決済金額（円）</label>' +
          '<input type="number" name="payAmount_' + idx + '" value="0" min="0" step="1">' +
        '</div>' +
        '<div class="field">' +
          '<label>商品総額（円）</label>' +
          '<input type="number" name="totalAmount_' + idx + '" value="0" min="0" step="1">' +
        '</div>' +
      '</div>' +
      '<div class="field">' +
        '<label>残額決済期限</label>' +
        '<input type="date" name="remainDate_' + idx + '">' +
      '</div>';

    return div;
  }

  function removeContract(idx) {
    var el = document.getElementById('contract-' + idx);
    if (el) el.remove();
  }

  document.getElementById('addContractBtn').addEventListener('click', function() {
    var container = document.getElementById('contractsContainer');
    container.appendChild(createContractBlock());
  });

  // フォーム送信
  document.getElementById('form').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');

    // 案件名（基本情報のチェックボックス）
    var caseNames = [];
    document.querySelectorAll('[name="case_cb"]:checked').forEach(function(cb) {
      caseNames.push(cb.value);
    });
    if (caseNames.length === 0) {
      showMsg('❌ 案件名を1つ以上選択してください。', 'error');
      return;
    }
    var caseNamesStr = caseNames.join('・');

    // 商談数バリデーション: AND($D2<>"", $D2<>$E2+$G2+$H2+$I2)
    var deals  = Number(document.getElementById('deals').value  || 0);
    var cancel = Number(document.getElementById('cancel').value || 0);
    var wins   = Number(document.getElementById('wins').value   || 0);
    var losses = Number(document.getElementById('losses').value || 0);
    var cuts   = Number(document.getElementById('cuts').value   || 0);
    if (deals !== 0 && deals !== cancel + wins + losses + cuts) {
      showMsg('❌ 商談数がキャンセル・成約数・失注数・損切数の合計と一致しません。', 'error');
      return;
    }
    var contractBlockCount = document.querySelectorAll('.contract-block').length;
    if (wins !== contractBlockCount) {
      showMsg('❌ 成約数（' + wins + '）と成約情報の件数（' + contractBlockCount + '）が一致しません。', 'error');
      return;
    }

    btn.disabled = true;
    btn.textContent = '送信中...';

    // 成約ブロックを収集
    var contracts = [];
    var blocks = document.querySelectorAll('.contract-block');
    blocks.forEach(function(block) {
      var idx = block.id.replace('contract-', '');
      contracts.push({
        caseName:    caseNamesStr,
        payMethod:   (block.querySelector('[name="payMethod_' + idx + '"]') || {}).value || '',
        payAmount:   (block.querySelector('[name="payAmount_' + idx + '"]') || {}).value || '0',
        totalAmount: (block.querySelector('[name="totalAmount_' + idx + '"]') || {}).value || '0',
        remainDate:  (block.querySelector('[name="remainDate_' + idx + '"]') || {}).value || '',
      });
    });

    var data = {
      date:       document.getElementById('date').value,
      name:       document.getElementById('name').value,
      caseNames:  caseNamesStr,
      deals:      document.getElementById('deals').value,
      cancel:     document.getElementById('cancel').value,
      repeat:     document.getElementById('repeat').value,
      wins:       document.getElementById('wins').value,
      losses:     document.getElementById('losses').value,
      cuts:       document.getElementById('cuts').value,
      lossReason: document.getElementById('lossReason').value,
      memo:       document.getElementById('memo').value,
      contracts:  contracts,
    };

    google.script.run
      .withSuccessHandler(function() {
        showMsg('✅ 送信完了しました！', 'success');
        document.getElementById('form').reset();
        document.getElementById('contractsContainer').innerHTML = '';
        contractCount = 0;
        var today = new Date();
        var y = today.getFullYear();
        var m = String(today.getMonth() + 1).padStart(2, '0');
        var d = String(today.getDate()).padStart(2, '0');
        document.getElementById('date').value = y + '-' + m + '-' + d;
        btn.disabled = false;
        btn.textContent = '送信する';
      })
      .withFailureHandler(function() {
        showMsg('❌ 送信に失敗しました。もう一度お試しください。', 'error');
        btn.disabled = false;
        btn.textContent = '送信する';
      })
      .submitReport(data);
  });

  function showMsg(text, type) {
    var el = document.getElementById('msg');
    el.textContent = text;
    el.className = type;
    el.style.display = 'block';
    window.scrollTo(0, 0);
    setTimeout(function() { el.style.display = 'none'; }, 4000);
  }
</script>
</body>
</html>
