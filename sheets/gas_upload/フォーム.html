<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>稼働管理</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:    #191939;
    --navy-lt: #252560;
    --gold:    #f0b329;
    --gold-lt: #fff3cd;
    --green:   #1e7e34;
    --green-lt:#e8f5e9;
    --red:     #c62828;
    --red-lt:  #ffebee;
    --gray-bg: #f4f6fa;
    --gray-bd: #e0e4ef;
    --white:   #ffffff;
    --text:    #1a1a2e;
    --text-sub:#6b7280;
    --radius:  10px;
    --shadow:  0 2px 12px rgba(25,25,57,0.10);
  }

  body {
    font-family: 'Meiryo', 'メイリオ', 'Hiragino Sans', sans-serif;
    background: var(--gray-bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
  }

  /* ─── ヘッダー ─── */
  header {
    background: var(--navy);
    color: var(--white);
    padding: 0 20px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-logo {
    width: 32px; height: 32px;
    background: var(--gold);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 0.04em;
  }
  .user-chip {
    background: rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 12px;
    color: rgba(255,255,255,0.85);
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ─── 稼働中バナー ─── */
  #current-banner {
    display: none;
    background: linear-gradient(90deg, var(--green) 0%, #2e7d32 100%);
    color: var(--white);
    padding: 10px 20px;
    font-size: 13px;
    font-weight: bold;
    text-align: center;
    letter-spacing: 0.02em;
  }
  #current-banner .pulse {
    display: inline-block;
    width: 8px; height: 8px;
    background: #a5d6a7;
    border-radius: 50%;
    margin-right: 6px;
    animation: pulse 1.5s infinite;
    vertical-align: middle;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.5; transform: scale(1.3); }
  }

  /* ─── メインコンテンツ ─── */
  main {
    max-width: 540px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }

  /* ─── セクション ─── */
  .section {
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    margin-bottom: 16px;
  }
  .section-header {
    background: var(--navy);
    color: var(--white);
    padding: 10px 16px;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-header.danger { background: var(--red); }
  .section-header-icon { font-size: 14px; }

  /* ─── クライアントカード ─── */
  .client-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--gray-bd);
    transition: background 0.15s;
  }
  .client-card:last-child { border-bottom: none; }
  .client-card.active { background: var(--green-lt); }

  .client-info { flex: 1; min-width: 0; }
  .client-name {
    font-size: 15px;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .client-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: bold;
    color: var(--green);
    margin-top: 3px;
  }
  .client-badge .dot {
    width: 7px; height: 7px;
    background: var(--green);
    border-radius: 50%;
    animation: pulse 1.5s infinite;
  }
  .client-badge.warn { color: var(--red); }
  .client-badge.warn .dot { background: var(--red); animation: none; }

  /* ─── ボタン ─── */
  .btn {
    border: none;
    border-radius: 8px;
    padding: 9px 18px;
    font-size: 13px;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s, box-shadow 0.1s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .btn:hover  { opacity: 0.88; }
  .btn:active { transform: scale(0.96); box-shadow: none; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .btn-start   { background: var(--navy); color: var(--white); box-shadow: 0 2px 6px rgba(25,25,57,0.25); }
  .btn-end     { background: var(--gold); color: var(--navy);  box-shadow: 0 2px 6px rgba(240,179,41,0.35); }
  .btn-cancel  { background: #e9ecf3; color: var(--text); }
  .btn-primary { background: var(--navy); color: var(--white); width: 100%; padding: 13px; font-size: 14px; }
  .btn-danger  { background: var(--red);  color: var(--white); }

  /* ─── ローディング ─── */
  #loading {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-sub);
  }
  .spinner {
    display: inline-block;
    width: 32px; height: 32px;
    border: 3px solid var(--gray-bd);
    border-top-color: var(--navy);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ─── トースト ─── */
  #toast {
    display: none;
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--white);
    padding: 12px 20px;
    border-radius: 24px;
    font-size: 13px;
    font-weight: bold;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    z-index: 200;
    white-space: nowrap;
    max-width: 90vw;
    text-overflow: ellipsis;
    overflow: hidden;
  }
  #toast.success { background: var(--green); }
  #toast.error   { background: var(--red); }

  /* ─── 空ステート ─── */
  .empty-state {
    padding: 32px 20px;
    text-align: center;
    color: var(--text-sub);
    font-size: 13px;
    line-height: 1.8;
  }

  /* ─── モーダル ─── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,10,30,0.55);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
    backdrop-filter: blur(2px);
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--white);
    border-radius: 16px 16px 0 0;
    padding: 24px 20px 32px;
    width: 100%;
    max-width: 540px;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.18);
    animation: slideUp 0.22s ease-out;
  }
  @keyframes slideUp {
    from { transform: translateY(40px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }

  .modal-drag {
    width: 40px; height: 4px;
    background: var(--gray-bd);
    border-radius: 2px;
    margin: 0 auto 20px;
  }
  .modal-title {
    font-size: 12px;
    font-weight: bold;
    color: var(--text-sub);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  .modal-client {
    font-size: 20px;
    font-weight: bold;
    color: var(--navy);
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 2px solid var(--gold);
  }

  .form-label {
    display: block;
    font-size: 12px;
    font-weight: bold;
    color: var(--text-sub);
    margin-bottom: 6px;
    margin-top: 14px;
  }

  .form-input, .form-select, .form-textarea {
    width: 100%;
    border: 1.5px solid var(--gray-bd);
    border-radius: 8px;
    padding: 11px 12px;
    font-family: inherit;
    font-size: 14px;
    background: var(--white);
    color: var(--text);
    transition: border-color 0.15s;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus {
    outline: none;
    border-color: var(--navy);
  }
  .form-textarea { resize: vertical; min-height: 80px; }
  .form-hint {
    font-size: 11px;
    color: var(--text-sub);
    margin-top: 4px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  .modal-actions .btn { flex: 1; padding: 13px; font-size: 14px; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="header-logo">📋</div>
    <h1>稼働管理</h1>
  </div>
  <div class="user-chip" id="user-info">読み込み中...</div>
</header>

<div id="current-banner" role="status"></div>

<main>
  <div id="loading">
    <div class="spinner"></div><br>データを読み込んでいます
  </div>

  <div id="app" style="display:none">

    <!-- クライアント一覧 -->
    <div class="section">
      <div class="section-header">
        <span class="section-header-icon">👥</span>
        担当クライアント
      </div>
      <div id="client-list"></div>
    </div>

    <!-- 未終了レコード -->
    <div class="section" id="correction-section" style="display:none">
      <div class="section-header danger">
        <span class="section-header-icon">⚠</span>
        未終了の稼働記録（要修正）
      </div>
      <div id="correction-list"></div>
    </div>

  </div>
</main>

<!-- 稼働開始モーダル -->
<div class="modal-overlay" id="modal-start" onclick="handleOverlayClick(event,'modal-start')">
  <div class="modal">
    <div class="modal-drag"></div>
    <div class="modal-title">稼働開始</div>
    <div class="modal-client" id="modal-start-client"></div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal('modal-start')">キャンセル</button>
      <button class="btn btn-start" id="btn-do-start" onclick="doStartWork()">▶ 開始する</button>
    </div>
  </div>
</div>

<!-- 稼働終了モーダル -->
<div class="modal-overlay" id="modal-end" onclick="handleOverlayClick(event,'modal-end')">
  <div class="modal">
    <div class="modal-drag"></div>
    <div class="modal-title">稼働終了</div>
    <div class="modal-client" id="modal-end-client"></div>
    <label class="form-label">作業内容 <span style="color:var(--red)">*必須</span></label>
    <textarea class="form-textarea" id="input-memo" placeholder="例：メール対応、スケジュール調整など"></textarea>
    <label class="form-label">備考（任意）</label>
    <textarea class="form-textarea" id="input-note" placeholder="例：本日の特記事項"></textarea>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal('modal-end')">キャンセル</button>
      <button class="btn btn-end" id="btn-do-end" onclick="doEndWork()">⏹ 終了する</button>
    </div>
  </div>
</div>

<!-- 稼働修正モーダル -->
<div class="modal-overlay" id="modal-correct" onclick="handleOverlayClick(event,'modal-correct')">
  <div class="modal">
    <div class="modal-drag"></div>
    <div class="modal-title">稼働記録を修正</div>
    <div style="font-size:13px; color:var(--text-sub); margin-bottom:16px; padding:10px 12px; background:var(--gray-bg); border-radius:8px;">
      <span id="modal-correct-date"></span>　開始 <strong id="modal-correct-start"></strong>
    </div>
    <label class="form-label">クライアント名</label>
    <select class="form-select" id="select-correct-client"></select>
    <label class="form-label">終了時刻（省略可）</label>
    <input type="time" class="form-input" id="input-correct-end">
    <p class="form-hint">クライアント名のみ変更する場合は終了時刻を空白のままにしてください</p>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal('modal-correct')">キャンセル</button>
      <button class="btn btn-primary" id="btn-do-correct" onclick="doCorrectRecord()">修正して保存</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
let state = {
  email: '',
  clients: [],
  currentClient: null,
  openRecords: [],
};

let pendingClient     = '';
let pendingRowIndex   = null;
let pendingEndTime    = '';
let pendingClientName = '';

// ──────────────────────────────
// 初期化
// ──────────────────────────────
window.onload = function() {
  google.script.run
    .withSuccessHandler(onClientsLoaded)
    .withFailureHandler(onError)
    .getMyClients();
};

function onClientsLoaded(data) {
  state.email   = data.email;
  state.clients = data.clients;
  document.getElementById('user-info').textContent = data.email;
  google.script.run
    .withSuccessHandler(onCurrentLoaded)
    .withFailureHandler(onError)
    .getCurrentWorking();
}

function onCurrentLoaded(current) {
  state.currentClient = current;
  google.script.run
    .withSuccessHandler(onOpenRecordsLoaded)
    .withFailureHandler(onError)
    .getOpenRecords();
}

function onOpenRecordsLoaded(records) {
  state.openRecords = records;
  renderApp();
  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

// ──────────────────────────────
// レンダリング
// ──────────────────────────────
function renderApp() {
  const banner = document.getElementById('current-banner');
  if (state.currentClient) {
    banner.style.display = 'block';
    banner.innerHTML = '<span class="pulse"></span>稼働中：<strong>' + escHtml(state.currentClient.client) + '</strong>　' + escHtml(state.currentClient.startTime) + ' 〜';
  } else {
    banner.style.display = 'none';
  }

  const list = document.getElementById('client-list');
  if (state.clients.length === 0) {
    list.innerHTML = '<div class="empty-state">担当クライアントが登録されていません。<br>管理者にご連絡ください。</div>';
  } else {
    list.innerHTML = state.clients.map(function(c) {
      var isActive = state.currentClient && state.currentClient.client === c.name;
      return '<div class="client-card' + (isActive ? ' active' : '') + '">' +
        '<div class="client-info">' +
          '<div class="client-name">' + escHtml(c.name) + '</div>' +
          (isActive ? '<div class="client-badge"><span class="dot"></span>稼働中 ' + escHtml(state.currentClient.startTime) + ' 〜</div>' : '') +
        '</div>' +
        (isActive
          ? '<button class="btn btn-end" onclick="openEndModal(\'' + escAttr(c.name) + '\')">⏹ 終了</button>'
          : '<button class="btn btn-start" onclick="openStartModal(\'' + escAttr(c.name) + '\')">▶ 開始</button>') +
        '</div>';
    }).join('');
  }

  var section  = document.getElementById('correction-section');
  var corrList = document.getElementById('correction-list');
  if (!state.openRecords || state.openRecords.length === 0) {
    section.style.display = 'none';
  } else {
    section.style.display = 'block';
    corrList.innerHTML = state.openRecords.map(function(r) {
      var isCurrent = state.currentClient && r.rowIndex === state.currentClient.rowIndex;
      return '<div class="client-card' + (isCurrent ? ' active' : '') + '">' +
        '<div class="client-info">' +
          '<div class="client-name">' + escHtml(r.client) + '</div>' +
          '<div class="client-badge warn"><span class="dot"></span>' + escHtml(r.date) + '　開始 ' + escHtml(r.startTime) + (isCurrent ? '　（稼働中）' : '') + '</div>' +
        '</div>' +
        '<button class="btn btn-danger" onclick="openCorrectModal(' + r.rowIndex + ',\'' + escAttr(r.date) + '\',\'' + escAttr(r.client) + '\',\'' + escAttr(r.startTime) + '\')">修正</button>' +
        '</div>';
    }).join('');
  }
}

// ──────────────────────────────
// 稼働開始
// ──────────────────────────────
function openStartModal(clientName) {
  pendingClient = clientName;
  document.getElementById('modal-start-client').textContent = clientName;
  openModal('modal-start');
}

function doStartWork() {
  setLoading('btn-do-start', true);
  google.script.run
    .withSuccessHandler(onStartDone)
    .withFailureHandler(onError)
    .startWork(pendingClient, '');
}

function onStartDone(res) {
  closeModal('modal-start');
  setLoading('btn-do-start', false);
  if (!res.ok) { showToast(res.msg, 'error'); return; }
  state.currentClient = { client: pendingClient, startTime: res.startTime, rowIndex: res.rowIndex };
  if (res.autoEndedRowIndex) {
    state.openRecords = state.openRecords.filter(function(r) { return r.rowIndex !== res.autoEndedRowIndex; });
  }
  var today = new Date();
  var dateStr = today.getFullYear() + '/' + String(today.getMonth()+1).padStart(2,'0') + '/' + String(today.getDate()).padStart(2,'0');
  state.openRecords.push({ rowIndex: res.rowIndex, date: dateStr, client: pendingClient, startTime: res.startTime });
  renderApp();
  showToast(res.autoEnded
    ? '「' + res.autoEnded + '」を自動終了 → 「' + pendingClient + '」を開始しました'
    : '「' + pendingClient + '」の稼働を開始しました', 'success');
}

// ──────────────────────────────
// 稼働終了
// ──────────────────────────────
function openEndModal(clientName) {
  pendingClient = clientName;
  document.getElementById('modal-end-client').textContent = clientName;
  document.getElementById('input-memo').value = '';
  document.getElementById('input-note').value = '';
  openModal('modal-end');
}

function doEndWork() {
  var memo = document.getElementById('input-memo').value.trim();
  if (!memo) { showToast('作業内容を入力してください', 'error'); return; }
  setLoading('btn-do-end', true);
  google.script.run
    .withSuccessHandler(onEndDone)
    .withFailureHandler(onError)
    .endWork(pendingClient, memo, document.getElementById('input-note').value.trim());
}

function onEndDone(res) {
  closeModal('modal-end');
  setLoading('btn-do-end', false);
  if (!res.ok) { showToast(res.msg, 'error'); return; }
  var currentRowIndex = state.currentClient ? state.currentClient.rowIndex : null;
  state.openRecords = state.openRecords.filter(function(r) {
    return !(r.client === pendingClient && r.rowIndex === currentRowIndex);
  });
  state.currentClient = null;
  renderApp();
  showToast('「' + pendingClient + '」の稼働を終了しました（' + res.endTime + '）', 'success');
}

// ──────────────────────────────
// 稼働修正
// ──────────────────────────────
function openCorrectModal(rowIndex, date, client, startTime) {
  pendingRowIndex = rowIndex;
  document.getElementById('modal-correct-date').textContent  = date;
  document.getElementById('modal-correct-start').textContent = startTime;
  document.getElementById('input-correct-end').value = '';
  var select = document.getElementById('select-correct-client');
  select.innerHTML = state.clients.map(function(c) {
    return '<option value="' + escAttr(c.name) + '"' + (c.name === client ? ' selected' : '') + '>' + escHtml(c.name) + '</option>';
  }).join('');
  openModal('modal-correct');
}

function doCorrectRecord() {
  pendingEndTime    = document.getElementById('input-correct-end').value;
  pendingClientName = document.getElementById('select-correct-client').value;
  setLoading('btn-do-correct', true);
  google.script.run
    .withSuccessHandler(onCorrectDone)
    .withFailureHandler(onError)
    .correctRecord(pendingRowIndex, pendingEndTime, pendingClientName);
}

function onCorrectDone(res) {
  closeModal('modal-correct');
  setLoading('btn-do-correct', false);
  if (!res.ok) { showToast(res.msg, 'error'); return; }
  if (pendingEndTime) {
    state.openRecords = state.openRecords.filter(function(r) { return r.rowIndex !== pendingRowIndex; });
    if (state.currentClient && state.currentClient.rowIndex === pendingRowIndex) {
      state.currentClient = null;
    }
  } else {
    state.openRecords = state.openRecords.map(function(r) {
      return r.rowIndex === pendingRowIndex ? Object.assign({}, r, { client: pendingClientName }) : r;
    });
    if (state.currentClient && state.currentClient.rowIndex === pendingRowIndex) {
      state.currentClient = Object.assign({}, state.currentClient, { client: pendingClientName });
    }
  }
  renderApp();
  showToast('稼働記録を修正しました', 'success');
}

// ──────────────────────────────
// ユーティリティ
// ──────────────────────────────
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function handleOverlayClick(e, id) {
  if (e.target === e.currentTarget) closeModal(id);
}

var toastTimer;
function showToast(msg, type) {
  var el = document.getElementById('toast');
  el.className = type || '';
  el.textContent = type === 'success' ? '✓ ' + msg : type === 'error' ? '⚠ ' + msg : msg;
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.style.display = 'none'; }, 4000);
}

function setLoading(btnId, loading) {
  var btn = document.getElementById(btnId);
  if (!btn) return;
  btn.disabled = loading;
  if (loading) {
    btn.textContent = '処理中...';
  } else {
    var labels = { 'btn-do-start': '▶ 開始する', 'btn-do-end': '⏹ 終了する', 'btn-do-correct': '修正して保存' };
    btn.textContent = labels[btnId] || '実行';
  }
}

function onError(err) {
  document.getElementById('loading').style.display = 'none';
  showToast(typeof err === 'string' ? err : (err.message || 'エラーが発生しました'), 'error');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return String(s).replace(/'/g,'&#39;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
