<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スリーンク 管理ツール</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hiragino Sans', 'Yu Gothic', sans-serif;
      background: #f5f7fa;
      color: #333;
      min-height: 100vh;
    }
    .header {
      background: #1a3a3a;
      color: #fff;
      padding: 16px 24px;
    }
    .header-title { font-size: 18px; font-weight: bold; }
    .header-sub { font-size: 12px; opacity: 0.7; margin-top: 2px; }
    .container { max-width: 700px; margin: 0 auto; padding: 24px 16px; }
    .page { display: none; }
    .page.active { display: block; }

    /* ナビゲーション */
    .nav-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 8px;
    }
    .nav-card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .nav-card:hover { border-color: #1a3a3a; transform: translateY(-2px); }
    .nav-card .icon { font-size: 36px; margin-bottom: 8px; }
    .nav-card .card-title { font-size: 15px; font-weight: bold; color: #1a3a3a; }
    .nav-card .card-desc { font-size: 12px; color: #888; margin-top: 4px; }
    .nav-card.disabled { opacity: 0.4; cursor: not-allowed; }
    .nav-card.disabled:hover { border-color: transparent; transform: none; }

    /* フォーム共通 */
    .form-card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }
    .form-title {
      font-size: 18px;
      font-weight: bold;
      color: #1a3a3a;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid #1a3a3a;
    }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      color: #555;
      margin-bottom: 6px;
    }
    .required { color: #e74c3c; margin-left: 4px; }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s;
      background: #fff;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #1a3a3a;
    }
    .form-group textarea { min-height: 80px; resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* ボタン */
    .btn {
      display: inline-block;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-primary { background: #1a3a3a; color: #fff; width: 100%; }
    .btn-primary:hover { background: #2a5a5a; }
    .btn-secondary { background: #eee; color: #555; }
    .btn-secondary:hover { background: #ddd; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* 結果表示 */
    .result-box {
      display: none;
      padding: 16px;
      border-radius: 8px;
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.6;
    }
    .result-box.success { background: #e8f5e9; border: 1px solid #4caf50; color: #2e7d32; }
    .result-box.error   { background: #fce4ec; border: 1px solid #e91e63; color: #880e4f; }

    /* LINE文章ボックス */
    .line-msg-box {
      background: #f0faf0;
      border: 1px solid #4caf50;
      border-radius: 8px;
      padding: 16px;
      margin-top: 12px;
    }
    .line-msg-box .msg-label { font-size: 12px; color: #555; margin-bottom: 8px; font-weight: bold; }
    .line-msg-box pre {
      white-space: pre-wrap;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.6;
      color: #333;
    }
    .copy-btn {
      margin-top: 10px;
      padding: 8px 16px;
      background: #4caf50;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
    }

    /* 案件一覧テーブル */
    .table-wrap { overflow-x: auto; }
    .case-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 500px; }
    .case-table th {
      background: #1a3a3a;
      color: #fff;
      padding: 10px 12px;
      text-align: left;
      font-weight: normal;
      white-space: nowrap;
    }
    .case-table td { padding: 10px 12px; border-bottom: 1px solid #eee; vertical-align: top; }
    .case-table tr:hover td { background: #f9f9f9; }
    .status-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      white-space: nowrap;
    }
    .s-発注中   { background: #e3f2fd; color: #1565c0; }
    .s-納品待ち { background: #fff8e1; color: #f57f17; }
    .s-承認待ち { background: #fce4ec; color: #880e4f; }
    .s-請求待ち { background: #f3e5f5; color: #6a1b9a; }
    .s-支払待ち { background: #e8f5e9; color: #1b5e20; }
    .s-支払済み { background: #e0e0e0; color: #424242; }

    /* 戻るボタン */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #1a3a3a;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 16px;
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
    }
    .back-btn:hover { text-decoration: underline; }

    /* ローディング */
    .loading { text-align: center; padding: 40px; color: #888; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #eee;
      border-top-color: #1a3a3a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 案件番号ハイライト */
    .case-id-highlight {
      font-family: monospace;
      background: #f5f5f5;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-title">📋 スリーンク 管理ツール</div>
  <div class="header-sub">株式会社スリーンク 統合管理システム</div>
</div>

<div class="container">

  <!-- ========== トップページ ========== -->
  <div id="page-top" class="page active">
    <div class="nav-grid">
      <div class="nav-card" onclick="showPage('order')">
        <div class="icon">📝</div>
        <div class="card-title">案件発注</div>
        <div class="card-desc">新しい案件を登録し<br>LINE発注文章を生成</div>
      </div>
      <div class="nav-card" onclick="showPage('submit')">
        <div class="icon">📦</div>
        <div class="card-title">成果物提出</div>
        <div class="card-desc">案件番号を入力して<br>納品物URLを提出</div>
      </div>
      <div class="nav-card" onclick="showPage('status')">
        <div class="icon">📊</div>
        <div class="card-title">案件状況確認</div>
        <div class="card-desc">案件の進捗状況を<br>一覧で確認</div>
      </div>
      <div class="nav-card disabled">
        <div class="icon">💰</div>
        <div class="card-title">請求書提出</div>
        <div class="card-desc">（近日実装予定）</div>
      </div>
    </div>
  </div>

  <!-- ========== 案件発注フォーム ========== -->
  <div id="page-order" class="page">
    <button class="back-btn" onclick="showPage('top')">← 戻る</button>
    <div class="form-card">
      <div class="form-title">📝 案件発注</div>

      <div class="form-group">
        <label>依頼者<span class="required">*</span></label>
        <select id="order-requester">
          <option value="">読み込み中...</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>顧客（クライアント）<span class="required">*</span></label>
          <select id="order-customer">
            <option value="">読み込み中...</option>
          </select>
        </div>
        <div class="form-group">
          <label>ジャンル<span class="required">*</span></label>
          <select id="order-genre">
            <option value="">読み込み中...</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>案件詳細</label>
        <textarea id="order-detail" placeholder="案件の内容・詳細を入力してください"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>発注日<span class="required">*</span></label>
          <input type="date" id="order-date">
        </div>
        <div class="form-group">
          <label>納品希望日</label>
          <input type="date" id="order-due-date">
        </div>
      </div>

      <div class="form-group">
        <label>予想費用（円）<span class="required">*</span></label>
        <input type="number" id="order-estimated" placeholder="例: 15000" min="0">
      </div>

      <button class="btn btn-primary" id="order-submit-btn" onclick="submitOrder()">
        案件を発注する
      </button>
      <div id="order-result" class="result-box"></div>
    </div>
  </div>

  <!-- ========== 成果物提出フォーム ========== -->
  <div id="page-submit" class="page">
    <button class="back-btn" onclick="showPage('top')">← 戻る</button>
    <div class="form-card">
      <div class="form-title">📦 成果物提出</div>

      <div class="form-group">
        <label>案件番号<span class="required">*</span></label>
        <input type="text" id="submit-case-id" placeholder="例: 1-2-3-260315-15000">
      </div>
      <div class="form-group">
        <label>納品物URL<span class="required">*</span></label>
        <input type="url" id="submit-url" placeholder="https://...">
      </div>
      <div class="form-group">
        <label>コメント・補足</label>
        <textarea id="submit-comment" placeholder="補足説明があれば記入してください"></textarea>
      </div>

      <button class="btn btn-primary" onclick="submitDelivery()">成果物を提出する</button>
      <div id="submit-result" class="result-box"></div>
    </div>
  </div>

  <!-- ========== 案件状況確認 ========== -->
  <div id="page-status" class="page">
    <button class="back-btn" onclick="showPage('top')">← 戻る</button>
    <div class="form-card">
      <div class="form-title">📊 案件状況確認</div>
      <div style="display:flex;gap:12px;align-items:flex-end;">
        <div class="form-group" style="flex:1;margin-bottom:0;">
          <label>依頼者で絞り込み（任意）</label>
          <select id="status-requester">
            <option value="">全員</option>
          </select>
        </div>
        <button class="btn btn-secondary" onclick="loadCaseList()" style="height:42px;padding:0 20px;margin-bottom:0;">絞り込む</button>
      </div>
    </div>
    <div id="case-list-container">
      <div class="loading"><div class="spinner"></div><div>読み込み中...</div></div>
    </div>
  </div>

</div>

<script>
// =====================================================
// 状態管理
// =====================================================
let formDataCache = null;

// =====================================================
// ページ遷移
// =====================================================
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  window.scrollTo(0, 0);
  if (name === 'order') loadFormData();
  if (name === 'submit') loadFormData();
  if (name === 'status') { loadFormData(); loadCaseList(); }
}

// =====================================================
// google.script.run ラッパー（Promiseに変換）
// =====================================================
function runGAS(fnName, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject)
      [fnName](...args);
  });
}

// =====================================================
// マスターデータ読み込み
// =====================================================
function loadFormData() {
  if (formDataCache) { applyFormData(formDataCache); return; }

  runGAS('getFormDataForClient')
    .then(data => {
      formDataCache = data;
      applyFormData(data);
    })
    .catch(err => console.error('フォームデータ読み込みエラー:', err));
}

function applyFormData(data) {
  fillSelect('order-requester', data.requesters, '依頼者を選択...');
  fillSelect('order-customer', data.customers, '顧客を選択...');
  fillSelect('order-genre', data.genres, 'ジャンルを選択...');

  // 状況確認の絞り込みセレクト
  const sel = document.getElementById('status-requester');
  sel.innerHTML = '<option value="">全員</option>';
  data.requesters.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r.id;
    opt.textContent = r.id + ': ' + r.name;
    sel.appendChild(opt);
  });

  // 発注日のデフォルト
  if (!document.getElementById('order-date').value) {
    document.getElementById('order-date').value = new Date().toISOString().split('T')[0];
  }
}

function fillSelect(id, items, placeholder) {
  const sel = document.getElementById(id);
  if (!sel) return;
  sel.innerHTML = '<option value="">' + placeholder + '</option>';
  (items || []).forEach(item => {
    const opt = document.createElement('option');
    opt.value = item.id;
    opt.textContent = item.id + ': ' + item.name;
    sel.appendChild(opt);
  });
}

// =====================================================
// 案件発注
// =====================================================
function submitOrder() {
  const requester = document.getElementById('order-requester').value;
  const customer  = document.getElementById('order-customer').value;
  const genre     = document.getElementById('order-genre').value;
  const detail    = document.getElementById('order-detail').value;
  const orderDate = document.getElementById('order-date').value;
  const dueDate   = document.getElementById('order-due-date').value;
  const estimated = document.getElementById('order-estimated').value;

  if (!requester || !customer || !genre || !orderDate || !estimated) {
    showResult('order-result', false, '必須項目（依頼者・顧客・ジャンル・発注日・予想費用）を入力してください');
    return;
  }

  const btn = document.getElementById('order-submit-btn');
  btn.disabled = true;
  btn.textContent = '登録中...';

  runGAS('registerCaseFromWeb', requester, customer, genre, detail, orderDate, dueDate, estimated)
    .then(data => {
      if (!data.success) throw new Error(data.error);

      const box = document.getElementById('order-result');
      box.style.display = 'block';
      box.className = 'result-box success';
      box.innerHTML =
        '<strong>✅ 案件を発注しました！</strong><br>' +
        '案件番号: <span class="case-id-highlight">' + escHtml(data.caseId) + '</span>' +
        '<div class="line-msg-box">' +
          '<div class="msg-label">📱 LINE発注文章（コピーして送付してください）</div>' +
          '<pre id="line-msg-text">' + escHtml(data.lineMsg) + '</pre>' +
          '<button class="copy-btn" onclick="copyMsg()">📋 コピーする</button>' +
        '</div>';
      resetOrderForm();
    })
    .catch(err => showResult('order-result', false, err.message || String(err)))
    .finally(() => {
      btn.disabled = false;
      btn.textContent = '案件を発注する';
    });
}

function resetOrderForm() {
  ['order-requester','order-customer','order-genre','order-detail','order-due-date','order-estimated']
    .forEach(id => { document.getElementById(id).value = ''; });
}

function copyMsg() {
  const text = document.getElementById('line-msg-text').innerText;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => alert('コピーしました！LINEに貼り付けてください。'));
  } else {
    const el = document.createElement('textarea');
    el.value = text;
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
    alert('コピーしました！');
  }
}

// =====================================================
// 成果物提出
// =====================================================
function submitDelivery() {
  const caseId = document.getElementById('submit-case-id').value.trim();
  const url    = document.getElementById('submit-url').value.trim();
  const comment = document.getElementById('submit-comment').value;

  if (!caseId || !url) {
    showResult('submit-result', false, '案件番号と納品物URLは必須です');
    return;
  }

  runGAS('submitDeliveryFromWeb', caseId, url, comment)
    .then(data => {
      if (!data.success) throw new Error(data.error);
      showResult('submit-result', true, data.message);
      document.getElementById('submit-case-id').value = '';
      document.getElementById('submit-url').value = '';
      document.getElementById('submit-comment').value = '';
    })
    .catch(err => showResult('submit-result', false, err.message || String(err)));
}

// =====================================================
// 案件状況確認
// =====================================================
function loadCaseList() {
  const reqId = document.getElementById('status-requester').value;
  const container = document.getElementById('case-list-container');
  container.innerHTML = '<div class="loading"><div class="spinner"></div><div>読み込み中...</div></div>';

  runGAS('getCaseListForClient', reqId)
    .then(data => {
      if (!data.success) throw new Error(data.error);
      renderCases(data.cases);
    })
    .catch(err => {
      container.innerHTML = '<div class="result-box error" style="display:block;">エラー: ' + escHtml(String(err)) + '</div>';
    });
}

function renderCases(cases) {
  const container = document.getElementById('case-list-container');
  if (!cases || cases.length === 0) {
    container.innerHTML = '<div class="form-card" style="text-align:center;color:#888;padding:40px;">案件がありません</div>';
    return;
  }
  const rows = cases.map(c =>
    '<tr>' +
      '<td><span class="case-id-highlight">' + escHtml(String(c.caseId)) + '</span></td>' +
      '<td>' + escHtml(c.requesterName) + '</td>' +
      '<td>' + escHtml(c.customerName) + '</td>' +
      '<td>' + escHtml(c.genreName) + '</td>' +
      '<td>' + escHtml(c.dueDate || '—') + '</td>' +
      '<td><span class="status-badge s-' + escHtml(c.status) + '">' + escHtml(c.status) + '</span></td>' +
    '</tr>'
  ).join('');

  container.innerHTML =
    '<div class="form-card" style="padding:0;overflow:hidden;">' +
      '<div class="table-wrap">' +
        '<table class="case-table">' +
          '<thead><tr>' +
            '<th>案件番号</th><th>依頼者</th><th>顧客</th><th>ジャンル</th><th>納品希望日</th><th>状態</th>' +
          '</tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
        '</table>' +
      '</div>' +
    '</div>';
}

// =====================================================
// ユーティリティ
// =====================================================
function showResult(id, success, msg) {
  const el = document.getElementById(id);
  el.style.display = 'block';
  el.className = 'result-box ' + (success ? 'success' : 'error');
  el.textContent = (success ? '✅ ' : '❌ ') + msg;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// 初期化
window.onload = loadFormData;
</script>

</body>
</html>
